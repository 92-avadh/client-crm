<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/retentio-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Retentio - Premium Subscription-Based Client Management Platform for agencies, CAs, and consultants." />
    <title>Retentio — Client Management Platform</title>
    <!-- Google Fonts: Host Grotesk, Plus Jakarta Sans, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Prevent Dark/Light Mode Theme Flash on Load -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('retentio_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-dark text-slate" style="background-color: #090d16; margin: 0; min-height: 100vh;">
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100svh;width:100%;margin:0;background-color:#090d16;">
        <div style="width:38px;height:38px;border:3px solid rgba(255,255,255,0.12);border-top-color:#22c55e;border-radius:50%;animation:retentioSpin 0.75s linear infinite;box-sizing:border-box;"></div>
        <style>
          @keyframes retentioSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
